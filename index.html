<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التبريكات والزيارات</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            padding: 30px;
            text-align: center;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: #3498db;
            outline: none;
        }

        button {
            width: 100%;
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #2980b9;
        }

        #statusMessage {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        .success {
            color: #27ae60;
        }

        .error {
            color: #e74c3c;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>أرسل تهنئتك</h2>
        
        <form id="wishForm">
            <div class="form-group">
                <label for="name">الاسم:</label>
                <input type="text" id="name" required placeholder="أدخل اسمك الكريم">
            </div>

            <div class="form-group">
                <label for="message">التهنئة / الرسالة:</label>
                <textarea id="message" rows="4" required placeholder="أكتب تهنئتك هنا..."></textarea>
            </div>

            <button type="submit" id="submitBtn">إرسال التهنئة</button>
        </form>

        <div id="statusMessage"></div>
    </div>

    <script>
        // ضع رابط Google Apps Script الخاص بك هنا
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzRRfbgXZEylEMZb1kpqdKR-rD-ZipluSh-7GhnkfNjdJjOsW_2o9Tygap1bHlCIaz9/exec";

        // 1. تسجيل الزيارة فور تحميل الصفحة دون مشاكل CORS
        window.addEventListener('DOMContentLoaded', function() {
            if (GOOGLE_SCRIPT_URL && !GOOGLE_SCRIPT_URL.includes("YOUR_SCRIPT_ID")) {
                const visitUrl = `${GOOGLE_SCRIPT_URL}?action=visit&t=${new Date().getTime()}`;
                const img = new Image();
                img.src = visitUrl;
            }
        });

        // 2. معالجة إرسال نموذج التهنئة عبر POST
        document.getElementById('wishForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const message = document.getElementById('message').value.trim();
            const statusDiv = document.getElementById('statusMessage');
            const submitBtn = document.getElementById('submitBtn');

            if (!name || !message) {
                statusDiv.className = 'error';
                statusDiv.innerText = 'يرجى ملء جميع الحقول المطلوب.';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = 'جاري الإرسال...';
            statusDiv.innerText = '';

            const payload = {
                type: "wish",
                name: name,
                message: message,
                time: new Date().toLocaleString('ar-EG')
            };

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                statusDiv.className = 'success';
                statusDiv.innerText = 'تم إرسال تهنئتك بنجاح، شكراً لك!';
                document.getElementById('wishForm').reset();
            })
            .catch(error => {
                statusDiv.className = 'error';
                statusDiv.innerText = 'حدث خطأ أثناء الإرسال، يرجى المحاولة لاحقاً.';
                console.error('Error:', error);
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = 'إرسال التهنئة';
            });
        });
    </script>
</body>
</html>
